version: '3'

services:
  nginx:
    image: nginx:latest
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx:/etc/nginx/conf.d
      - ./frontend:/usr/share/nginx/html
      - /etc/letsencrypt:/etc/letsencrypt
    depends_on:
      - backend
    restart: always
    networks:
      - app-network

  backend:
    build: ./backend
    ports:
      - "5000:5000"
    volumes:
      - ./backend:/app
    depends_on:
      - db
    restart: always
    env_file:
      - docker-compose.env
    networks:
      - app-network

  db:
    image: postgres:latest
    env_file:
      - docker-compose.env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always
    networks:
      - app-network

  ctfd:
    image: ctfd/ctfd:latest
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - docker-compose.env
    volumes:
      - ctfd_data:/var/uploads
      - ctfd_logs:/var/log/CTFd
    depends_on:
      - db
      - cache
    networks:
      - app-network

  cache:
    image: redis:latest
    restart: always
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  postgres_data:
  ctfd_data:
  ctfd_logs: 